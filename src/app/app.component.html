<mat-toolbar class="mt-toolbar-class">
<span>{{title}}</span>
<div class="menu-toolbar-spacer"></div>
  <button mat-button routerLink="/home" routerLinkActive="active">Home</button>
  <button mat-button routerLink="/about" routerLinkActive="active">About Me</button>
  <button mat-button routerLink="/experience" routerLinkActive="active">Experience</button>
  <button mat-button routerLink="/education" routerLinkActive="active">Education</button>
  <button mat-button routerLink="/certification" routerLinkActive="active">Awards & Certification</button>
  <button mat-button routerLink="/contact" routerLinkActive="active">Contact Me</button>
</mat-toolbar>
<mat-toolbar class="footer-toolbar">
  <button matIconButton aria-label="icon-button with facebook icon">
    <mat-icon><a href="{{this.facebookUrl}}" target="_blank">facebook</a></mat-icon>
  </button>
  <button matIconButton aria-label="icon-button with icon">
    <mat-icon><a href="{{this.xUrl}}" target="_blank"><img src="/assets/icons/png/x.png"/></a></mat-icon>
  </button>
  <button matIconButton aria-label="icon-button with github icon">
    <mat-icon><a href="{{this.githubUrl}}" target="_blank"><img src="/assets/icons/png/github.png"/></a></mat-icon>
  </button>
  <button matIconButton aria-label="icon-button with github icon">
    <mat-icon><a href="{{this.oldGithubUrl}}" target="_blank"><img src="/assets/icons/png/github.png"/></a></mat-icon>
  </button>
  <div class="footer-toolbar-spacer"></div>
  <button matIconButton aria-label="icon-button with share icon">
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>
<router-outlet/>
